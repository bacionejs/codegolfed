<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Golfed Path Puzzle Test Harness</title>
  <style>
    body { font-family: monospace; background: #121212; color: #eee; padding: 20px; }
    .panel { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    #g { display: inline-grid; gap: 1px; background: #000; border: 1px solid #444; }
    #g x { display: flex; align-items: center; justify-content: center; font-size: 11px; }
  </style>
</head>
<body>

<div class="panel">
  <label>Size (S): <span id="sVal">30</span>
    <input type="range" id="S" min="10" max="30" value="30">
  </label>
  <label>Density (D): <span id="dVal">0.1</span>
    <input type="range" id="D" min="0.1" max="0.3" step="0.05" value="0.1">
  </label>
  <label>Length (L): <span id="lVal">8</span>
    <input type="range" id="L" min="4" max="8" value="8">
  </label>
  <label>
    <input type="checkbox" id="sol"> Show Solution
  </label>
  <button id="gen">Generate</button>
  <span id="status" style="color:#ff6b6b"></span>
</div>

<x id="g"></x>

<script>
let G = [], p = 0, z = 0, pathSet = new Set();

function generate() {
  const S = +document.getElementById('S').value;
  const D = +document.getElementById('D').value;
  const L = +document.getElementById('L').value;
  const T = S * S;
  const R = Math.random;
  const status = document.getElementById('status');
  status.textContent = '';

  let dists = {}, parent = {}, found = false, attempts = 0;

  function C(s) {
    dists = { [s]: 0 };
    parent = {};
    const q = [s];
    for (let u of q) {
      if (u == z) return dists[u];
      for (let i = S; i--;) {
        for (let n of [i * S + u % S, u - u % S + i]) {
          if (G[n] && !(n in dists)) {
            dists[n] = dists[u] + 1;
            parent[n] = u;
            q.push(n);
          }
        }
      }
    }
  }

  do {
    if (++attempts > 50000) {
      status.textContent = 'Impossible combination! Adjust L or D.';
      return;
    }
    G = [];
    p = R() * T | 0;
    z = R() * T | 0;
    for (let i = 0; i < T;) G[i++] = R() < D;
  } while (C(p) != L);

  // Reconstruct path
  pathSet.clear();
  let curr = z;
  while (curr !== undefined) {
    pathSet.add(curr);
    curr = parent[curr];
  }

  render();
}

function render() {
  const S = +document.getElementById('S').value;
  const showSol = document.getElementById('sol').checked;
  const g = document.getElementById('g');
  const A = `repeat(${S}, 45px)`;

  g.style = `grid:${A}/${A}; display:inline-grid; gap:1px; background:#000;`;
  g.innerHTML = G.map((v, i) => {
    const isStartEnd = i == p || i == z;
    const isPath = showSol && pathSet.has(i) && !isStartEnd;
    const bg = isStartEnd ? 'red' : isPath ? '#e5c07b' : v ? '#080' : '#808';
    return `<x style="background:${bg}; color:#000">${isPath ? '•' : ''}</x>`;
  }).join('');
}

['S', 'D', 'L'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    document.getElementById(id.toLowerCase() + 'Val').textContent = e.target.value;
    generate();
  });
});
document.getElementById('sol').addEventListener('change', render);
document.getElementById('gen').addEventListener('click', generate);

generate();
</script>
</body>
</html>
