<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puzzle Generator Test Harness</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #121212;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      background: #1e1e1e;
      padding: 16px;
      border-radius: 8px;
      width: 320px;
    }
    .controls label {
      font-weight: bold;
    }
    .full-width {
      grid-column: span 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    button {
      padding: 8px 16px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #005999;
    }
    #g x.solution {
      background: #ff0 !important;
    }
  </style>
</head>
<body>

<div class="controls">
  <label for="valS">Size (S):</label>
  <input type="range" id="valS" min="1" max="30" value="30" step="1">
  <span id="outS">30</span>

  <label for="valD">Density (D):</label>
  <input type="range" id="valD" min="0.1" max="0.3" value="0.1" step="0.01">
  <span id="outD">0.1</span>

  <label for="valL">Length (L):</label>
  <input type="range" id="valL" min="4" max="9" value="8" step="1">
  <span id="outL">8</span>

  <div class="full-width">
    <label>
      <input type="checkbox" id="toggleSol"> Show Solution
    </label>
    <button id="btnGen">Generate</button>
  </div>
</div>

<x id="g"></x>

<script>
let currentData = null;

const $ = id => document.getElementById(id);

['S', 'D', 'L'].forEach(param => {
  $(`val${param}`).oninput = (e) => {
    $(`out${param}`).textContent = e.target.value;
  };
});

function generate() {
  const S = +$('valS').value;
  const D = +$('valD').value;
  const L = +$('valL').value;

  const T = S * S;
  const A = `repeat(${S},${90/S}dvmin)`;
  g.style = `
    grid:${A}/${A};
    display:inline-grid;
    gap:1px;
    background:#000;
  `;

  const R = Math.random;
  let G, p, z, v, c, q;

  const C = s => {
    v = {[s]: 0};
    c = {[s]: 1};
    for (u of q = [s]) {
      if (u == z) return c[u] == 1 ? v[u] : 0;
      for (i = S; i--;)
        for (n of [i * S + u % S, u - u % S + i])
          G[n] && (!(n in v) && (v[n] = v[u] + 1, c[n] = 0, q.push(n)), v[n] == v[u] + 1 && (c[n] += c[u]))
    }
    return 0;
  };

  let attempts = 0;
  do {
    for (G = [], p = R() * T | 0, z = R() * T | 0, i = 0; i < T;)
      G[i++] = R() < D;
    attempts++;
    if (attempts > 100000) {
      alert("Could not generate puzzle with current criteria.");
      return;
    }
  } while (C(p) != L);

  // Backtrack to find the solution path
  const path = new Set();
  let curr = z;
  while (curr !== undefined && curr !== p) {
    path.add(curr);
    let next = undefined;
    for (let i = S; i--;) {
      for (let n of [i * S + curr % S, curr - curr % S + i]) {
        if (G[n] && v[n] === v[curr] - 1) {
          next = n;
          break;
        }
      }
      if (next !== undefined) break;
    }
    curr = next;
  }
  path.add(p);

  currentData = { G, p, z, path, S };
  render();
}

function render() {
  if (!currentData) return;
  const { G, p, z, path } = currentData;
  const showSol = $('toggleSol').checked;

  g.innerHTML = G.map((v, i) => {
    const isStartEnd = i == p || i == z;
    const isSol = showSol && path.has(i) && !isStartEnd;
    const bg = isStartEnd ? 'red' : isSol ? '#ff0' : v ? '#080' : '#808';
    return `<x style="background:${bg}"></x>`;
  }).join('');
}

$('btnGen').onclick = generate;
$('toggleSol').onchange = render;

generate();
</script>

</body>
</html>
