<style>*{margin:0;border:1px solid black}#g{display:grid;width:100dvmin;aspect-ratio:1}</style><div id=g></div><script>let S=12,P=5,E=.25,R=Math.random,T=S*S,H=T/2|0,G,p,z,L,N;g.style.grid=`repeat(${S},1fr)/repeat(${S},1fr)`;
function I(){do{L=0;G=[...Array(T)].map(_=>R()<E);while(!G[p=R()*(T-H)+H|0]);while(!G[z=R()*H|0]);N=C(p)}while(N%99<P);D()}
function C(s,q=[[s,0]],v={}){while(q.length){let[u,d]=q.shift();if(u==z)return d;if(!v[u]){v[u]=1;let a=u/S|0,b=u%S;for(let i=0;i<S;i++){G[i*S+b]&&i!=a&&q.push([i*S+b,d+1]);G[a*S+i]&&i!=b&&q.push([a*S+i,d+1])}}}return 99}
function D(){g.innerHTML='';for(let i=0;i<T;i++){let d=document.createElement('div');d.style.background=i==p?'blue':i==z?'red':G[i]?'green':'tan';d.onclick=()=>{if((i%S==p%S)!=(~(i/S)==~(p/S))&&G[i]&&L+1+C(i)<=N){L++;p=i;p==z?I():D()}};g.append(d)}}
I();</script>
