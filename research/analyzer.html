<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rook Board Pathfinding Evaluation App</title>
    <style>





  *{user-select:none;touch-action:none}  html{overscroll-behavior:none}




        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            
            --inactive-sq: purple;
            --active-sq: green;
            --origin-sq: red;
            --dest-sq: red;
            --path-sq: green;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 1100px;
        }

        @media (min-width: 900px) {
            .main-container {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .control-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        label span.value-display {
            background-color: var(--bg-color);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-family: monospace;
            color: var(--accent);
            border: 1px solid var(--border-color);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .stats-box {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .stat-label {
            color: var(--text-muted);
        }

        .stat-value {
            font-weight: 600;
            font-family: monospace;
        }

        .btn {
            margin-top: 1rem;
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .board-container {
            flex-grow: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            min-height: 300px;
        }

        canvas {
            width: 100%;
            max-width: 300px;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            background-color: var(--bg-color);
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.5);
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
    </header>

    <div class="main-container">
        <!-- Control Panel -->
        <div class="control-panel">
            <div class="control-group">
                <label for="boardSizeSlider">
                    Board Size
                    <span id="boardSizeVal" class="value-display">20</span>
                </label>
                <input type="range" id="boardSizeSlider" min="1" max="50" value="12">
            </div>

            <div class="control-group">
                <label for="activePctSlider">
                    Active Squares (%)
                    <span id="activePctVal" class="value-display">60%</span>
                </label>
                <input type="range" id="activePctSlider" min="1" max="50" value="25">
            </div>

            <div class="control-group">
                <label for="minMovesSlider">
                    Min Viable Path (Moves)
                    <span id="minMovesVal" class="value-display">5</span>
                </label>
                <input type="range" id="minMovesSlider" min="1" max="20" value="5">
            </div>

            <button class="btn" id="regenerateBtn">Regenerate Board</button>

            <div class="stats-box">
                <div class="stat-item">
                    <span class="stat-label">Generations Taken:</span>
                    <span id="statGen" class="stat-value">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Shortest Path Length:</span>
                    <span id="statPathLen" class="stat-value">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Shortest Routes:</span>
                    <span id="statPathCount" class="stat-value">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Active Squares Count:</span>
                    <span id="statActiveCount" class="stat-value">-</span>
                </div>
            </div>

            <div id="errorMessage" class="error-message">
                Could not find a valid configuration within limits. Try easing the constraints.
            </div>
        </div>

        <!-- Board & Visualization Canvas -->
        <div class="board-container">
            <canvas id="boardCanvas" width="600" height="600"></canvas>
            
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background: var(--active-sq);"></div>Active</div>
                <div class="legend-item"><div class="legend-color" style="background: var(--inactive-sq); border: 1px solid var(--border-color);"></div>Disabled</div>
                <div class="legend-item"><div class="legend-color" style="background: var(--origin-sq);"></div>Origin (Left)</div>
                <div class="legend-item"><div class="legend-color" style="background: var(--dest-sq);"></div>Destination (Right)</div>
                <div class="legend-item"><div class="legend-color" style="background: var(--path-sq);"></div>Single Sample Route</div>
            </div>
        </div>
    </div>

    <script>
onpointerdown=e=>{e.preventDefault()}
oncontextmenu=e=>false;
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');

        const boardSizeSlider = document.getElementById('boardSizeSlider');
        const activePctSlider = document.getElementById('activePctSlider');
        const minMovesSlider = document.getElementById('minMovesSlider');

        const boardSizeVal = document.getElementById('boardSizeVal');
        const activePctVal = document.getElementById('activePctVal');
        const minMovesVal = document.getElementById('minMovesVal');

        const statGen = document.getElementById('statGen');
        const statPathLen = document.getElementById('statPathLen');
        const statPathCount = document.getElementById('statPathCount');
        const statActiveCount = document.getElementById('statActiveCount');
        const errorMessage = document.getElementById('errorMessage');
        const regenerateBtn = document.getElementById('regenerateBtn');

        let currentResult = null;

        function getParams() {
            return {
                N: parseInt(boardSizeSlider.value),
                pct: parseInt(activePctSlider.value),
                minMoves: parseInt(minMovesSlider.value)
            };
        }

        function updateLabels() {
            boardSizeVal.textContent = boardSizeSlider.value;
            activePctVal.textContent = activePctSlider.value + '%';
            minMovesVal.textContent = minMovesSlider.value;
        }

        function bfs(grid, N, start, target) {
            const dist = new Int32Array(N * N);
            dist.fill(-1);
            const ways = new Float64Array(N * N);
            const parent = new Int32Array(N * N);
            parent.fill(-1);

            dist[start] = 0;
            ways[start] = 1;
            const queue = [start];
            let found = false;

            while (queue.length > 0) {
                const curr = queue.shift();
                if (curr === target) {
                    found = true;
                }

                const r = Math.floor(curr / N);
                const c = curr % N;

                const directions = [
                    { dr: 0, dc: -1, limit: c },       // Left
                    { dr: 0, dc: 1, limit: N - 1 - c }, // Right
                    { dr: -1, dc: 0, limit: r },       // Up
                    { dr: 1, dc: 0, limit: N - 1 - r }  // Down
                ];

                for (let d of directions) {
                    let nr = r;
                    let nc = c;
                    for (let step = 1; step <= d.limit; step++) {
                        nr += d.dr;
                        nc += d.dc;
                        const nIdx = nr * N + nc;
                        if (grid[nIdx] === 1) {
                            if (dist[nIdx] === -1) {
                                dist[nIdx] = dist[curr] + 1;
                                ways[nIdx] = ways[curr];
                                parent[nIdx] = curr;
                                queue.push(nIdx);
                            } else if (dist[nIdx] === dist[curr] + 1) {
                                ways[nIdx] += ways[curr];
                            }
                        }
                    }
                }
            }

            if (dist[target] === -1) return null;

            // Reconstruct a single representative path
            const path = [];
            let curr = target;
            while (curr !== -1) {
                path.push(curr);
                curr = parent[curr];
            }
            path.reverse();

            return { path, pathCount: ways[target] };
        }

        function generateBoardAndPath() {
            const { N, pct, minMoves } = getParams();
            const totalCells = N * N;
            const targetActiveCount = Math.max(2, Math.floor(totalCells * (pct / 100)));
            const midCol = Math.floor(N / 2);

            let generations = 0;
            const maxGenerations = 600;

            while (generations < maxGenerations) {
                generations++;
                const grid = new Uint8Array(totalCells);

                // Origin in left half, destination in right half
                const origR = Math.floor(Math.random() * N);
                const origC = Math.floor(Math.random() * Math.max(1, midCol));
                const origIdx = origR * N + origC;

                const destR = Math.floor(Math.random() * N);
                const destC = midCol + Math.floor(Math.random() * Math.max(1, N - midCol));
                const destIdx = destR * N + destC;

                if (origIdx === destIdx) continue;

                grid[origIdx] = 1;
                grid[destIdx] = 1;

                let activeCount = 2;
                let attempts = 0;
                while (activeCount < targetActiveCount && attempts < totalCells * 2) {
                    const r = Math.floor(Math.random() * N);
                    const c = Math.floor(Math.random() * N);
                    const idx = r * N + c;
                    if (grid[idx] === 0) {
                        grid[idx] = 1;
                        activeCount++;
                    }
                    attempts++;
                }

                if (activeCount < targetActiveCount) continue;

                const result = bfs(grid, N, origIdx, destIdx);
                if (result && (result.path.length - 1) >= minMoves) {
                    return { grid, N, origIdx, destIdx, path: result.path, pathCount: result.pathCount, generations, activeCount };
                }
            }

            return null;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!currentResult) {
                errorMessage.style.display = 'block';
                statGen.textContent = '-';
                statPathLen.textContent = '-';
                statPathCount.textContent = '-';
                statActiveCount.textContent = '-';
                return;
            }

            errorMessage.style.display = 'none';
            const { grid, N, origIdx, destIdx, path, pathCount, generations, activeCount } = currentResult;

            statGen.textContent = generations;
            statPathLen.textContent = path.length - 1;
            statPathCount.textContent = pathCount.toLocaleString();
            statActiveCount.textContent = `${activeCount} (${Math.round((activeCount / (N * N)) * 100)}%)`;

            const cellSize = canvas.width / N;
            const pathSet = new Set(path);

            // Draw Board Grid
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const idx = r * N + c;
                    const x = c * cellSize;
                    const y = r * cellSize;

                    if (idx === origIdx) {
                        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--origin-sq').trim();
                    } else if (idx === destIdx) {
                        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--dest-sq').trim();
                    } else if (pathSet.has(idx)) {
                        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--path-sq').trim();
                    } else if (grid[idx] === 1) {
                        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--active-sq').trim();
                    } else {
                        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--inactive-sq').trim();
                    }

                    ctx.fillRect(x + 0.5, y + 0.5, cellSize - 1, cellSize - 1);
                }
            }

            // Draw connecting lines along the highlighted sample route
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(1, cellSize / 8);
            ctx.beginPath();
            for (let i = 0; i < path.length; i++) {
                const r = Math.floor(path[i] / N);
                const c = path[i] % N;
                const cx = (c + 0.5) * cellSize;
                const cy = (r + 0.5) * cellSize;
                if (i === 0) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
            }
            ctx.stroke();
        }

        function runSearch() {
            updateLabels();
            currentResult = generateBoardAndPath();
            render();
        }

        // Event Listeners
        boardSizeSlider.addEventListener('input', runSearch);
        activePctSlider.addEventListener('input', runSearch);
        minMovesSlider.addEventListener('input', runSearch);
        regenerateBtn.addEventListener('click', runSearch);

        // Initial Load
        runSearch();
    </script>
</body>
</html>
