<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operational Envelope (L = 5)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        canvas {
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Operational Envelope (minpath=5)</h2>
        <canvas id="graphCanvas" width="750" height="480"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');

        const width = canvas.width;
        const height = canvas.height;
        const padding = 75;
        const graphWidth = width - padding - 55;
        const graphHeight = height - 2 * padding;

        const minN = 5, maxN = 55;
        const minP = 0, maxP = 45;

        // Coordinate scaling functions
        function toX(n) {
            return padding + ((n - minN) / (maxN - minN)) * graphWidth;
        }
        function toY(p) {
            return height - padding - ((p - minP) / (maxP - minP)) * graphHeight;
        }

        // Clear canvas
        ctx.clearRect(0, 0, width, height);

        // Draw Grid & Ticks
        ctx.strokeStyle = '#f0f2f5';
        ctx.fillStyle = '#586069';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        // Y-Axis Ticks & Grid Lines
        for (let p = 0; p <= maxP; p += 5) {
            let y = toY(p);
            ctx.beginPath();
            ctx.moveTo(padding, y);
            ctx.lineTo(width - 55, y);
            ctx.strokeStyle = (p % 10 === 0) ? '#e1e4e8' : '#f4f6f8';
            ctx.stroke();
            
            if (p % 10 === 0) {
                ctx.fillText(p + '%', padding - 12, y);
            }
        }

        // X-Axis Ticks & Grid Lines
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (let n = 10; n <= maxN; n += 10) {
            let x = toX(n);
            ctx.beginPath();
            ctx.moveTo(x, padding);
            ctx.lineTo(x, height - padding);
            ctx.strokeStyle = '#e1e4e8';
            ctx.stroke();
            ctx.fillText(n, x, height - padding + 10);
        }

        // Axis Labels (With Variables P and N restored)
        ctx.save();
        ctx.font = '13px 600 sans-serif';
        ctx.fillStyle = '#24292e';
        
        // Y-Axis Title
        ctx.translate(20, height / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.fillText('Active Density (%)', 0, 0);
        ctx.restore();

        // X-Axis Title
        ctx.fillText('Board Size', padding + graphWidth / 2, height - 15);

        // Draw Operational Window Fill Only (Gap Region)
        ctx.beginPath();
        let first = true;
        for (let n = minN; n <= maxN; n += 0.5) {
            let c5 = (120 / Math.sqrt(n)) - 4 * (5 - 5);
            let x = toX(n);
            let y = toY(c5);
            if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
        }
        for (let n = maxN; n >= minN; n -= 0.5) {
            let floor = 70 / n;
            let x = toX(n);
            let y = toY(floor);
            ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(33, 150, 243, 0.15)';
        ctx.fill();


        // Draw color indicator for operational gap
        ctx.fillStyle = 'rgba(33, 150, 243, 0.4)';
        ctx.fillRect(legendX, legendY + 2, 20, 14);
        ctx.strokeStyle = '#2196F3';
        ctx.lineWidth = 1;
        ctx.strokeRect(legendX, legendY + 2, 20, 14);

        // Draw Formula text
        ctx.fillStyle = '#24292e';
        ctx.font = '12px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('70/N ≤ P ≤ 120/√N - 4(L - 5)', legendX + 30, legendY + 9);
    </script>
</body>
</html>
